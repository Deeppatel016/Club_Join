<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Registration - ClubJoin</title><link rel="stylesheet" href="css/style.css"><script src="js/script.js" defer></script></head>
<body><header><h1>ClubJoin</h1><p>Student Registration</p></header><nav><a href="index.html">Home</a><a href="clubs.html">Clubs</a><a href="login.html">Login</a></nav>
<main><h2>Create Student Account</h2>
<form action="reg.php" method="post" onsubmit="return validateRegistration()">
<label for="name">Full name</label><input id="name" name="name" required>
<label for="email">Email</label><input type="email" id="email" name="email" required>
<label for="mobile">Mobile number</label><input id="mobile" name="mobile" inputmode="numeric" maxlength="10" required>
<label for="password">Password (minimum 8 characters)</label><input type="password" id="password" name="password" minlength="8" required>
<label for="course">Course</label><select id="course" name="course" required><option value="">Select course</option><option>B.Tech AIML</option><option>B.Tech CSE</option><option>B.Tech IT</option><option>BCA</option><option>Other</option></select>
<label for="year">Year</label><select id="year" name="year" required><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select>
<label class="inline"><input type="checkbox" id="terms" name="terms" value="yes" required> I accept the terms and conditions.</label>
<button type="submit">Register</button></form><p>Already registered? <a href="login.html">Login here</a>.</p></main><footer><p>&copy; 2026 ClubJoin</p></footer></body></html>
